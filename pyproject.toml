[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-fuchs"
version = "0.1.0a0"
description = "Stochastic, risk-aware forest landscape planning on the TSA29 mini instance (WS3 inner LP + full-MC outer policy)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "UBC FRESH Lab" }]
keywords = ["forestry", "optimization", "stochastic", "monte-carlo", "forest-planning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
  "pydantic>=2",
  "pyyaml",
  "rich",
  "typer",
  "ws3",
  "highspy",
  "pulp",
]

[project.urls]
Homepage = "https://github.com/UBC-FRESH/fresh-fuchs"
Documentation = "https://ubc-fresh.github.io/fresh-fuchs/"
Repository = "https://github.com/UBC-FRESH/fresh-fuchs"
Issues = "https://github.com/UBC-FRESH/fresh-fuchs/issues"
Changelog = "https://github.com/UBC-FRESH/fresh-fuchs/blob/main/CHANGE_LOG.md"

[project.optional-dependencies]
bundle = [
  "femic @ git+https://github.com/UBC-FRESH/femic.git@v0.2.0a1",
  "geopandas",
]
rv = ["pacal>=1.6.1"]
fhops = ["fhops>=1.0.0"]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.5",
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
  "twine>=5",
]
quality = ["ruff>=0.5"]
release = [
  "build>=1.2",
  "twine>=5",
]
test = ["pytest>=8"]

[project.scripts]
fresh-fuchs = "fresh_fuchs.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
